[package]
name = "team-allocation"
version = "1.0.0"
description = "Team allocation planner (desktop)"
edition = "2021"
rust-version = "1.90"

[lib]
name = "team_allocation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
